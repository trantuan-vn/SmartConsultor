apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment-v1
  labels:
    app: gateway
    version: v1          
spec:
  replicas: 2  
  selector:
    matchLabels:
      app: gateway
      version: v1      
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1      
  template:
    metadata:
      labels:
        app: gateway
        version: v1      
        cluster: clustered-app
    spec:
      containers:
        - name: gateway
          image: tuantahp/gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Djava.net.preferIPv4Stack=true -Dvertx.jgroups.config=default-configs/default-jgroups-kubernetes.xml -Djgroups.dns.query=clustered-app.default.svc.cluster.local -Dvertx.logger-delegate-factory-class-name=io.vertx.core.logging.Log4j2LogDelegateFactory"
          ports:
            - containerPort: 31862
            - containerPort: 7800
          livenessProbe:
            httpGet:
              path: /health
              port: 31862
            failureThreshold: 1
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 31862
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /readiness
              port: 31862
            failureThreshold: 30
            periodSeconds: 10          